services:
  app:
    build:
      context: ..
      dockerfile: web/Dockerfile
    image: fire-command-studio-web:0.2.0
    command: ["--production", "--host", "0.0.0.0", "--public-url", "https://${STUDIO_DOMAIN:?Set the server domain before deployment}"]
    volumes:
      - training_data:/data
    expose: ["8080"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  https:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    environment:
      STUDIO_DOMAIN: ${STUDIO_DOMAIN:?Set the server domain before deployment}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - https_data:/data
      - https_config:/config
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  training_data:
  https_data:
  https_config:
