name: Verify synthetic training studio
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: npm run build
      - name: Build separate web workspace
        run: npm run build --workspace web
      - name: Build scene-first screen workspace
        run: npm run build --workspace screen
      - name: Build verified installer download page
        run: node site/build.mjs
      - name: Create ignored runtime directory
        run: python -c "from pathlib import Path; Path('runtime').mkdir(parents=True, exist_ok=True)"
      - run: python -m pytest tests screen/tests -q --basetemp=runtime/pytest
      - run: npm test
      - run: python scripts/dependency_inventory.py
      - run: python scripts/audit_python_dependencies.py
      - run: python -m scripts.audit_javascript_dependencies
      - name: Build web server distribution with dependency notices
        run: |
          python -m scripts.desktop_notices
          python -m scripts.build_web_package --output runtime/release/FIRE-Command-Studio-Web-0.2.0.zip
          python -m scripts.verify_web_package runtime/release/FIRE-Command-Studio-Web-0.2.0.zip --data-dir runtime/extracted-server-qa --output artifacts/extracted-server-proof.json
          python -m scripts.build_web_package --track screen --output runtime/release/FIRE-Screen-0.1.0.zip
          python -m scripts.verify_web_package runtime/release/FIRE-Screen-0.1.0.zip --data-dir runtime/extracted-screen-qa --output artifacts/extracted-screen-proof.json
      - uses: actions/upload-artifact@v7
        with:
          name: fire-command-studio-web-server
          path: |
            runtime/release/FIRE-Command-Studio-Web-0.2.0.zip
            runtime/release/FIRE-Command-Studio-Web-0.2.0.manifest.json
            artifacts/extracted-server-proof.json
            runtime/release/FIRE-Screen-0.1.0.zip
            runtime/release/FIRE-Screen-0.1.0.manifest.json
            artifacts/extracted-screen-proof.json
