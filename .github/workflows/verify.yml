name: Verify synthetic training studio
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: npm run build
      - name: Build verified installer download page
        run: node site/build.mjs
      - name: Create ignored runtime directory
        run: python -c "from pathlib import Path; Path('runtime').mkdir(parents=True, exist_ok=True)"
      - run: python -m pytest tests -q --basetemp=runtime/pytest
      - run: npm test
      - run: python scripts/dependency_inventory.py
      - run: python scripts/audit_python_dependencies.py
      - run: npm audit --audit-level=high
